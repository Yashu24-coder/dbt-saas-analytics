name: dbt CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  dbt-build:
    name: dbt build on DuckDB
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Regenerate the seed data
        run: python scripts/generate_seeds.py
      - name: dbt build (seeds, models, snapshots, tests)
        run: dbt build --profiles-dir . --no-partial-parse
      - name: Upload dbt artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: |
            target/manifest.json
            target/run_results.json
            logs/
